<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Query - LawyerBot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/dark-theme.css">
</head>
<body>
<nav class="dark-navbar">
    <div class="brand"><i class="fas fa-balance-scale"></i> LawyerBot</div>
    <ul class="nav-links">
        <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/admin"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="/admin_lawyers"><i class="fas fa-gavel"></i> Manage Lawyers</a></li>
        <li><a href="/view_data"><i class="fas fa-database"></i> View Data</a></li>
        <li><a href="/add_query" class="active"><i class="fas fa-plus-circle"></i> Add Query</a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</nav>

<section style="padding:40px 5%;max-width:800px;margin:0 auto;">
    <div style="margin-bottom:30px;">
        <h2 style="color:#fff;font-size:28px;"><i class="fas fa-plus-circle" style="color:#10b981;"></i> Add / Edit Section</h2>
        <p style="color:#888;">Select an IPC section to view or edit its details and lawyer contacts</p>
    </div>

    <div class="dark-card" style="padding:40px;">
        <div class="form-group" style="margin-bottom:20px;">
            <label style="color:#ccc;"><i class="fas fa-gavel"></i> Select IPC Section</label>
        </div>
        <div style="display:grid;gap:10px;max-height:500px;overflow-y:auto;padding-right:10px;">
            {% for rs in data %}
            <a href="/add_query1?sid={{rs[0]}}" class="dark-card" style="display:flex;align-items:center;gap:15px;padding:15px 20px;text-decoration:none;border:1px solid #333;transition:all 0.3s;">
                <span style="background:rgba(233,69,96,0.15);color:#e94560;padding:6px 14px;border-radius:8px;font-weight:700;white-space:nowrap;">Sec {{rs[4]}}</span>
                <span style="color:#ccc;font-size:14px;">{{rs[1]|truncate(80, True)}}</span>
                <i class="fas fa-chevron-right" style="margin-left:auto;color:#555;"></i>
            </a>
            {% endfor %}
        </div>
    </div>
</section>

<div class="dark-footer">&copy; 2025 LawyerBot &mdash; Admin Panel</div>
</body>
</html>
