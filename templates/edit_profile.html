<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit Profile - LawyerBot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/dark-theme.css">
</head>
<body>
<nav class="dark-navbar">
    <div class="brand"><i class="fas fa-balance-scale"></i> LawyerBot</div>
    <ul class="nav-links">
        <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/bot"><i class="fas fa-robot"></i> Chat</a></li>
        <li><a href="/lawyers"><i class="fas fa-search"></i> Find Lawyers</a></li>
        <li><a href="/requests"><i class="fas fa-file-alt"></i> My Requests</a></li>
        <li><a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</nav>

<section style="padding:40px 5%;max-width:700px;margin:0 auto;">
    <div style="margin-bottom:30px;">
        <h2 style="color:#fff;font-size:28px;"><i class="fas fa-user-edit" style="color:#e94560;"></i> Edit Your Profile</h2>
        <p style="color:#888;">Update your personal information</p>
    </div>

    {% if msg %}
    <div style="background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#10b981;padding:12px;border-radius:8px;margin-bottom:20px;text-align:center;font-size:14px;">
        <i class="fas fa-check-circle"></i> {{msg}}
    </div>
    {% endif %}

    <div class="dark-card" style="padding:40px;">
        <form method="post" class="dark-form">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" name="name" value="{{ user[1] or '' }}" placeholder="Full name" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Mobile</label>
                    <input type="text" name="mobile" value="{{ user[2] or '' }}" placeholder="Mobile number" required maxlength="10" pattern="[0-9]{10}">
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" value="{{ user[3] or '' }}" placeholder="Email address" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Location</label>
                <input type="text" name="location" value="{{ user[4] or '' }}" placeholder="City/State" required>
            </div>

            <div style="display:flex;gap:15px;margin-top:25px;">
                <button type="submit" style="flex:1;padding:14px;background:linear-gradient(135deg,#e94560,#c23152);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <a href="/bot" style="flex:1;padding:14px;background:#333;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</section>

<footer style="background:#0f172a;color:#888;text-align:center;padding:20px;font-size:13px;border-top:1px solid #1e293b;margin-top:50px;">
    <p>&copy; 2024 LawyerBot. All Rights Reserved.</p>
</footer>
</body>
</html>
